AWSTemplateFormatVersion: '2010-09-09'
Description: smartimg private originals bucket, delivered through CloudFront + AWS DIT

Parameters:
  BucketName:
    Type: String
    Description: Globally unique name for the image originals bucket
  AdminOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origin allowed to PUT directly to S3 with presigned URLs (browser CORS)

Resources:
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Not versioned on purpose. Every object here is derived from a source
      # that lives elsewhere — a NAS share, or the browser upload that made it —
      # so an overwritten version is re-derivable rather than lost, and keeping
      # noncurrent versions would only accrue storage for path-mirrored keys,
      # which are overwritten by design. Versioning can be switched on later if
      # that calculus changes; it cannot be switched off again, only suspended.
      # Incomplete multipart uploads are cleaned up so they cannot bill silently.
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            Prefix: ''
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
            AllowedOrigins:
              - !Ref AdminOrigin
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

Outputs:
  BucketName:
    Description: Name of the originals bucket
    Value: !Ref ImagesBucket
  BucketRegionalDomainName:
    Description: Regional endpoint of the bucket
    Value: !GetAtt ImagesBucket.RegionalDomainName
